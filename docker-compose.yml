version: '3.8'

services:
  backend:
    build: .
    container_name: csjmu_rag_backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=ollama
      - EMBEDDING_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://172.20.8.10:31435
      - OLLAMA_LLM_MODEL=llama3.1:8b
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text:latest
      - LLM_MODEL=llama3.1:8b
      - EMBEDDING_MODEL=nomic-embed-text:latest
      - COLLECTION_NAME=collection50
      - CHROMA_DB_DIR=./data/vector_db/CHECK_DB
    restart: unless-stopped

  frontend:
    build: .
    container_name: csjmu_rag_frontend
    command: streamlit run frontend/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - LLM_PROVIDER=ollama
      - EMBEDDING_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://172.20.8.10:31435
      - OLLAMA_LLM_MODEL=llama3.1:8b
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text:latest
      - LLM_MODEL=llama3.1:8b
      - EMBEDDING_MODEL=nomic-embed-text:latest
    depends_on:
      - backend
    restart: unless-stopped
