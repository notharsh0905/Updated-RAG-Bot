version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: csjmu_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    restart: unless-stopped

  backend:
    build: .
    container_name: csjmu_rag_backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - EMBEDDING_MODEL=nomic-embed-text
      - LLM_MODEL=llama3.2:3b
      - COLLECTION_NAME=collection50
      - CHROMA_DB_DIR=./data/vector_db/CHECK_DB
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build: .
    container_name: csjmu_rag_frontend
    command: streamlit run frontend/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - EMBEDDING_MODEL=nomic-embed-text
      - LLM_MODEL=llama3.2:3b
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_storage:
