name: CSJMU RAG System CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Set up Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8

    - name: Run Linting (flake8)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Pytest Unit Tests
      run: |
        pytest tests/ -v

    - name: Verify Evaluation Framework Schema
      run: |
        python -c "import json; questions = json.load(open('data/evaluation/eval_questions.json')); assert len(questions) >= 300, 'Evaluation dataset must contain at least 300 questions'"
        echo "✅ Evaluation dataset schema verified successfully."

    - name: Install Frontend Dependencies & Build Next.js
      run: |
        cd frontend
        npm ci
        npm run build
        echo "✅ Next.js production build succeeded."

    - name: Docker Build Check
      run: |
        docker build -t csjmu-rag-backend:latest -f Dockerfile .
        docker build -t csjmu-rag-frontend:latest -f frontend/Dockerfile frontend/
        echo "✅ Docker builds succeeded."
